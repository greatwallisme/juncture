[workspace]
resolver = "2"
members = [
    "crates/juncture",
    "crates/juncture-core",
    "crates/juncture-derive",
    "crates/juncture-checkpoint",
    "crates/juncture-tracing",
    "crates/juncture-mcp",
    "crates/juncture-store",
    "crates/juncture-telemetry",
    "examples",
    "examples/deep-research",
    "benchmarks",
]
exclude = [
    "examples/wasm-example",
    "examples/wasm-edge-cli",
    "examples/wasm-edge-server",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/greatwallisme/juncture"
readme = "README.md"
keywords = ["llm", "agent", "state-machine", "langgraph", "graph"]
categories = ["development-tools", "network-programming", "asynchronous"]
rust-version = "1.88"

# Dependency policy (prompt-cache correctness, design 12 §2.4 A)
#
# `serde_json` MUST NOT be built with `preserve_order`. Without it, `Value`
# objects are `BTreeMap`-backed and therefore key-sorted, which keeps the
# serialized prompt prefix byte-stable. Enabling `preserve_order` would switch
# every `Value` to insertion order and silently invalidate the provider prompt
# caches with no error anywhere. `juncture_core::prefix` additionally normalizes
# explicitly so the invariant does not rely on this build detail alone; do not
# rely on it instead of that normalization.
#
# Cargo has no per-dependency "negative feature" syntax, so this is enforced by
# review and by the `prefix` module's order-independence tests.
[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
